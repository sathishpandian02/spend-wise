<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='14' x='2' y='5' rx='2'/><line x1='2' x2='22' y1='10' y2='10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpendWise - Track smarter. Spend better. Save more. Full-Stack Personal Finance Management Application." />
    <meta name="theme-color" content="#F8FAFC" />
    <title>SpendWise | Track smarter. Spend better. Save more.</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('spendwise_theme');
          var theme = 'light';
          if (saved === 'dark') theme = 'dark';
          else if (saved === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add('theme-' + theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
